name: Build DevOS ISO & Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Installer and Update Safety
        run: |
          python3 -m unittest discover -s tests/unit -p 'test_install*.py'
          python3 -m unittest discover -s tests/unit -p 'test_storage*.py'
          python3 -m unittest discover -s tests/unit -p test_disk_manager.py
          python3 -m unittest discover -s tests/unit -p test_security_updates.py
          python3 -m unittest discover -s tests/unit -p test_updater.py
          python3 -m unittest discover -s tests/unit -p 'test_optimizer*.py'
          python3 -m unittest discover -s tests/unit -p test_responsiveness.py
          python3 -m unittest discover -s tests/unit -p test_task_pipeline.py

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            mtools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            zstd \
            qemu-system-x86 \
            ovmf \
            shellcheck \
            ffmpeg \
            python3-pyqt5

      - name: Test Recorder Media Exports
        run: /usr/bin/python3 tests/unit/test_recorder_edit.py

      - name: Lint Shell Scripts
        run: |
          shellcheck build/*.sh build/hooks/*.hook.chroot tests/qemu/*.sh || true

      - name: Build DevOS ISO
        run: |
          sudo DEVOS_ZSTD_LEVEL=15 bash ./build/build-iso.sh

      - name: Verify ISO Boot Layout
        run: bash tests/boot/verify-iso-bootability.sh out/devos-26.04-amd64.iso

      - name: Verify ISO Size and Checksum
        run: |
          ISO_FILE="out/devos-26.04-amd64.iso"
          test -f "$ISO_FILE"
          ISO_BYTES=$(stat -c%s "$ISO_FILE")
          MAX_BYTES=${DEVOS_MAX_ISO_BYTES:-5368709120}
          echo "ISO Size: $ISO_BYTES bytes (Release budget: $MAX_BYTES bytes)"
          if [ "$ISO_BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::ISO exceeds configured release size budget!"
            exit 1
          fi
          sha256sum "$ISO_FILE"

      # A bounded observation catches QEMU startup errors. It is not proof
      # that the desktop or a complete installation works.
      - name: Observe BIOS Startup
        run: |
          rc=0
          timeout 60s qemu-system-x86_64 \
            -m 2048 \
            -smp 2 \
            -cdrom out/devos-26.04-amd64.iso \
            -display none \
            -vga virtio \
            -serial stdio > out/qemu-bios.log 2>&1 || rc=$?
          cat out/qemu-bios.log
          case "$rc" in
            0|124) echo "BIOS observation finished; desktop readiness requires a runtime test." ;;
            *) echo "::error::QEMU failed with exit code $rc"; exit "$rc" ;;
          esac

      - name: Upload Boot Diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devos-boot-diagnostics
          path: out/qemu-bios.log
          if-no-files-found: ignore

      - name: Upload ISO and Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: devos-iso-build
          path: |
            out/devos-26.04-amd64.iso.sha256
            build_work/iso/casper/filesystem.manifest
            build_work/iso/casper/filesystem.size
