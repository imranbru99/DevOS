name: Build DevOS ISO & Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            mtools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            zstd \
            qemu-system-x86 \
            ovmf \
            shellcheck

      - name: Lint Shell Scripts
        run: |
          shellcheck build/*.sh build/hooks/*.hook.chroot tests/qemu/*.sh || true

      - name: Build DevOS ISO
        run: |
          sudo DEVOS_ZSTD_LEVEL=15 ./build/build-iso.sh

      - name: Verify ISO Size and Checksum
        run: |
          ISO_FILE="out/devos-24.04-amd64.iso"
          test -f "$ISO_FILE"
          ISO_BYTES=$(stat -c%s "$ISO_FILE")
          MAX_BYTES=$((4 * 1024 * 1024 * 1024))
          echo "ISO Size: $ISO_BYTES bytes (Limit: $MAX_BYTES bytes)"
          if [ "$ISO_BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::ISO exceeds 4.0 GB target limit!"
            exit 1
          fi
          sha256sum "$ISO_FILE"

      - name: Run QEMU Headless Smoke Test (BIOS)
        run: |
          timeout 60s qemu-system-x86_64 \
            -m 2048 \
            -smp 2 \
            -cdrom out/devos-24.04-amd64.iso \
            -display none \
            -vga virtio \
            -serial stdio || true

      - name: Upload ISO and Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: devos-iso-build
          path: |
            out/devos-24.04-amd64.iso.sha256
            build_work/iso/casper/filesystem.manifest
            build_work/iso/casper/filesystem.size
