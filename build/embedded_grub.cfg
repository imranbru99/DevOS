insmod search
insmod search_fs_file
insmod search_label
insmod iso9660
insmod part_gpt
insmod part_msdos
search --no-floppy --set=root --file /casper/vmlinuz
if [ ! -f /casper/vmlinuz ]; then
    search --no-floppy --set=root --label DEVOS_2604
fi
set prefix=($root)/boot/grub
configfile $prefix/grub.cfg
