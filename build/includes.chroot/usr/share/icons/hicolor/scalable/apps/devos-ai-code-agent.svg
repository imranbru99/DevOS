<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#021430" flood-opacity="0.45"/>
    </filter>

    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle with Drop Shadow -->
  <rect x="74" y="74" width="876" height="876" rx="200" ry="200" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Top Ambient Sheen -->
  <rect x="74" y="74" width="876" height="438" rx="200" ry="200" fill="url(#sheenGrad)"/>

  <!-- Inner Rim -->
  <rect x="74" y="74" width="876" height="876" rx="200" ry="200" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Crisp White Code Brackets -->
  <polyline points="390,330 240,512 390,694" fill="none" stroke="#ffffff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="634,330 784,512 634,694" fill="none" stroke="#ffffff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Golden Energy Bolt -->
  <path d="M565,280 L435,520 L515,520 L465,744 L600,496 L520,496 Z" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" filter="url(#boltGlow)"/>
</svg>
