<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Ambient Top Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Energy Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Golden Bolt Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020b1e" flood-opacity="0.55"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#d97706" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="74" y="74" width="876" height="876" rx="210" ry="210" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Top Ambient Sheen -->
  <rect x="74" y="74" width="876" height="438" rx="210" ry="210" fill="url(#sheenGrad)"/>

  <!-- Inner High-Tech Rim -->
  <rect x="74" y="74" width="876" height="876" rx="210" ry="210" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Pipeline Conduits / Connecting Rails -->
  <path d="M220,512 L804,512" stroke="url(#lineGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M220,512 L804,512" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Forward Flow Chevrons on Conduit -->
  <polyline points="340,490 365,512 340,534" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="660,490 685,512 660,534" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Node: ChatGPT / Input Prompt Node -->
  <circle cx="240" cy="512" r="80" fill="#0f172a" stroke="#38bdf8" stroke-width="16" filter="url(#glow)"/>
  <circle cx="240" cy="512" r="52" fill="#0284c7" opacity="0.4"/>
  <!-- Terminal Prompt Chevron in Node 1 -->
  <polyline points="228,484 256,512 228,540" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Node: Antigravity / Complete Execution Node -->
  <circle cx="784" cy="512" r="80" fill="#0f172a" stroke="#c084fc" stroke-width="16" filter="url(#glow)"/>
  <circle cx="784" cy="512" r="52" fill="#9333ea" opacity="0.4"/>
  <!-- Success / Execution Check in Node 3 -->
  <polyline points="760,514 778,534 812,492" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Hub: DevOS AI Scheduler Engine (Orb + Core Ring) -->
  <circle cx="512" cy="512" r="146" fill="#090d16" stroke="#f59e0b" stroke-width="18" filter="url(#boltGlow)"/>
  <circle cx="512" cy="512" r="116" fill="#1e293b" stroke="#ffffff" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Scheduler Clock Ticks around Center Ring -->
  <circle cx="512" cy="394" r="6" fill="#fbbf24"/>
  <circle cx="512" cy="630" r="6" fill="#fbbf24"/>
  <circle cx="394" cy="512" r="6" fill="#fbbf24"/>
  <circle cx="630" cy="512" r="6" fill="#fbbf24"/>

  <!-- High-Energy Lightning Bolt in Center (Continuous Pipeline Power) -->
  <path d="M538,400 L452,518 L516,518 L482,624 L576,502 L512,502 Z" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" filter="url(#boltGlow)"/>
</svg>