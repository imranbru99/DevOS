# DevOS systemd-oomd Configuration
# Protects desktop responsiveness using Linux Pressure Stall Information (PSI)
[OOM]
# Give multi-Chrome sessions time to recover before killing cgroups.
DefaultMemoryPressureDurationSec=40s
DefaultMemoryPressureLimit=50%
# Kill thrashing workloads earlier once disk swap is hot (zram preferred).
SwapUsedLimit=70%
