# DevOS Bulletproof Power & Session Protection
# Prevents accidental shutdowns, unexpected sleep timeouts during overnight tasks, and preserves background pipelines.

[Login]
# Never power off or sleep due to session idle (keeps long AI pipelines, downloads, and builds active)
IdleAction=ignore
IdleActionSec=infinity

# Prevent accidental physical power button tap from abruptly turning off the computer
# Short press is ignored; long hardware press (5 seconds) remains available as emergency fallback
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleRebootKey=ignore
HandleSuspendKey=suspend
HandleHibernateKey=ignore

# Laptop lid management: safe suspend into RAM with documents and sessions intact
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Keep user background services and pipeline tasks running even across session locks and desktop restarts
KillUserProcesses=no
