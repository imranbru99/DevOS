# Manage every port. "none" overrides Ubuntu's rule that ignores Ethernet.
# systemd-resolved owns /etc/resolv.conf. Chrome reads that file.
[main]
plugins=keyfile
dns=systemd-resolved

[ifupdown]
managed=true

[device]
match-device=type:ethernet
managed=1

[device]
match-device=type:wifi
managed=1

[keyfile]
unmanaged-devices=none
