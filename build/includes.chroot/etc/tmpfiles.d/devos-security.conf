# DevOS Security runtime folders.
# inbox: like /tmp (sticky; users can add files but not list or remove other
# users' files). The root quarantine service validates every request.
d /run/devos-security 0755 root root -
d /run/devos-security/inbox 1733 root root -
d /var/lib/DevOS/quarantine 0700 root root -
d /var/lib/DevOS/security 0755 root root -
