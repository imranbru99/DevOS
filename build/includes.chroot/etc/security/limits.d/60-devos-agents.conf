# DevOS High-Capacity Process & File Descriptor Limits
# Prevents "Too many open files" and fork resource exhaustion under heavy AI & browser multitasking.

*    soft    nofile     524288
*    hard    nofile    1048576
*    soft    nproc      262144
*    hard    nproc      524288
*    soft    memlock   unlimited
*    hard    memlock   unlimited
