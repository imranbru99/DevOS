# DevOS boot-menu title. This file is read after /etc/default/grub.
GRUB_DISTRIBUTOR="DevOS"
# Ubuntu 24.04 hides other systems by default. Keep Windows in the menu
# when DevOS is installed alongside it.
GRUB_DISABLE_OS_PROBER=false

# Straight into DevOS. Hold Shift or Esc during start-up for the menu.
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
# btrfs /boot cannot store grubenv; without this a failed-boot guess
# left people on a 30 s "DevOS" menu.
GRUB_RECORDFAIL_TIMEOUT=0

# Quiet kernel + DevOS splash so the next screen after firmware is branded.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash plymouth.theme=devos"
