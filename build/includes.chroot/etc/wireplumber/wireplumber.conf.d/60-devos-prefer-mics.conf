# DevOS: Prefer real microphones (especially USB) as the default capture device
# so calls, voice typing, and the screen recorder share one durable choice.
# WirePlumber still restores the user's last default from state-default-nodes;
# this only boosts dedicated mics when ranking "best" sources.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.form-factor = "microphone"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2500
        priority.driver = 2500
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.usb-.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2600
        priority.driver = 2600
      }
    }
  }
]
