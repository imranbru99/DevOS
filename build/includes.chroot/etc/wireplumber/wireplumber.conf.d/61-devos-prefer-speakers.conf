# DevOS: Prefer real speakers/headsets (especially USB) as the default playback
# device so apps share one durable choice. HDMI/DisplayPort stay available but
# rank lower than dedicated USB/analog outputs.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.form-factor = "speaker"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2500
        priority.driver = 2500
      }
    }
  }
  {
    matches = [
      {
        device.form-factor = "headset"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2550
        priority.driver = 2550
      }
    }
  }
  {
    matches = [
      {
        device.form-factor = "headphone"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2550
        priority.driver = 2550
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.usb-.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2600
        priority.driver = 2600
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*hdmi.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 500
        priority.driver = 500
      }
    }
  }
]
