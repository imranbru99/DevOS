# After GRUB is on the disk, put the DevOS firmware entry ahead of Windows.
# This must run on the live system. The target chroot does not own NVRAM.
# Soft-fail: flaky EFI NVRAM must not show "Installation Failed".
---
dontChroot: true
timeout: 120
script:
    - "/bin/bash -c '/usr/local/sbin/devos-set-boot-order || true; exit 0'"
