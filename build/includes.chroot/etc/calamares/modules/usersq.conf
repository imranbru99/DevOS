# Create the real account. The live user "devos" exists only on the USB.
---
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - sudo
    - netdev
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
allowWeakPasswords: true
allowWeakPasswordsDefault: true
userShell: /bin/bash
user:
    shell: /bin/bash
    forbidden_names:
        - root
hostname:
    location: EtcFile
    writeHostsFile: true
    template: devos

# The account page is optional: these are pre-filled so Next works at once.
# An empty password is allowed; devos-install-finalize then turns on
# automatic sign-in for that account.
presets:
    fullName:
        value: "DevOS User"
        editable: true
    loginName:
        value: "devos"
        editable: true
