---
# After Calamares localecfg may write bn_BD formats from install region,
# force English menus/clock/dates before first login. Timezone is unchanged.
# This Calamares build does not honor a leading "-" as skip-on-error, so wrap.
dontChroot: false
timeout: 180
script:
    - "/bin/bash -c '/usr/local/sbin/devos-force-english-ui || true; exit 0'"
