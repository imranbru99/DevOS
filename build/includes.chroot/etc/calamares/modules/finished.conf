# After a successful install, reboot onto DevOS (not Windows Boot Manager).
# Hard live reboot (busy /cdrom+loop0 hangs a normal shutdown). The script
# prints a console banner first so "Done" does not look like a blank crash.
# Scenic stylesheet styles this stock page so it never reads as a blank panel.
---
restartNowMode: user-checked
restartNowCommand: "/bin/bash /usr/local/sbin/devos-live-reboot"
restartNowChecked: true
notifyOnFinished: true
