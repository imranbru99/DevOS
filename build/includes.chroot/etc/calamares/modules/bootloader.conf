# Install GRUB onto the target disk for UEFI and legacy BIOS.
# The bootloader job reads the grub* keys directly; a missing key crashes it.
---
efiBootLoader: "grub"
kernel: "/vmlinuz"
img: "/initrd.img"
timeout: "5"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

efiBootloaderId: "DevOS"
installEFIFallback: true
