# Apply the "Choose your apps" page inside the new system: remove unticked
# built-ins now (no internet needed), leave downloads to devos-features.service.
---
dontChroot: false
timeout: 1800
script:
    - "-mkdir -p /var/lib/DevOS"
    - "/usr/local/bin/devos-features installer-plan /var/lib/DevOS/install-choices.json"
