# Record "Choose your apps" picks inside the new system.
# Do not apt-purge here — that used to stall Calamares at ~89% for a long time.
# Removals and downloads run on first boot via devos-features.service.
# Soft-fail: app plan must never abort a bootable install.
---
dontChroot: false
timeout: 120
script:
    - "/bin/bash -c 'mkdir -p /var/lib/DevOS; /usr/local/bin/devos-features installer-plan /var/lib/DevOS/install-choices.json || true; exit 0'"
