# Record "Choose your apps" picks inside the new system.
# Do not apt-purge here — that used to stall Calamares at ~89% for a long time.
# Removals and downloads run on first boot via devos-features.service.
# A plan that could not be saved or applied must be reported by Calamares.
---
dontChroot: false
timeout: 120
script:
    - "/usr/local/bin/devos-features installer-plan /var/lib/DevOS/install-choices.json"
