# DevOS Calamares mount module (Calamares 3.3)
# Ubuntu's calamares package ships no defaults. Without extraMounts the
# target has no /proc, /sys or /dev, and grub-install / update-initramfs fail.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

# btrfs subvolumes layout for Snapper snapshot support
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache
btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      # Use periodic fstrim.timer instead of continuous discard=async to prevent NVMe workqueue locks
      options: [ defaults, noatime, compress=zstd:3, space_cache=v2, commit=15 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
    - filesystem: ext4
      # Batch journal commits (~1/min) for snappier desktop IO under Chrome load.
      options: [ defaults, noatime, commit=60 ]
