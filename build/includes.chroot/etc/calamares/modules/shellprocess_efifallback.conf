# After GRUB is on the disk, make the EFI fallback path start DevOS too.
# Runs inside the installed system, where /boot/efi is mounted.
# Soft-fail: missing ESP / slow copy must not abort a finished OS install.
---
dontChroot: false
timeout: 180
script:
    - "/bin/bash -c '/usr/local/sbin/devos-install-efi-fallback || true; exit 0'"
