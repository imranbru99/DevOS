---
# Marks the live installer as completed so the session watchdog loop does not
# relaunch Calamares while the user reads the "finished" page or after a
# successful install where reboot was not requested.
# Must run on the LIVE system (/run is a tmpfs in the target chroot).
dontChroot: true
timeout: 30
script:
  - "/bin/bash -c 'mkdir -p /run; touch /run/devos-install-completed || true; exit 0'"
