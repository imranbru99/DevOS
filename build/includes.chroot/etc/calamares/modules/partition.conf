# DevOS Calamares Partition Module Configuration
---
# Default to btrfs with zstd compression
defaultFileSystemType:  "btrfs"
availableFileSystemTypes:
  - "btrfs"
  - "ext4"

# Enable LUKS full-disk encryption option
enableLuksAutomatedPartitioning: true

# Partitioning schema
defaultPartitionTableType: "gpt"

# Swap choice: DevOS uses zram by default, so disk swap is optional
userSwapChoices:
  - none
  - small
  - suspend

initialSwapChoice: none

# btrfs subvolumes layout for Snapper snapshot support
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /.snapshots
    subvolume: /@snapshots
  - mountPoint: /var/log
    subvolume: /@log
  - mountPoint: /var/cache
    subvolume: /@cache

# Mount options including zstd compression
btrfsMountOptions:
  - defaults
  - compress=zstd:3
  - noatime
