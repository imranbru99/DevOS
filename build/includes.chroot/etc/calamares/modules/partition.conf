# DevOS Calamares Partition Module Configuration (Calamares 3.3)
---
# EFI system partition created when the chosen disk is wiped.
# The old efiSystemPartition* keys are deprecated in 3.3.
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "DEVOS_EFI"

# Default to ext4 for maximum stability; btrfs available for snapshots
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs"]

# Enable LUKS full-disk encryption option
enableLuksAutomatedPartitioning: true
luksGeneration: luks1

# Firmware-aware partitioning: Calamares chooses GPT for UEFI and MBR for BIOS.
# Forcing GPT on BIOS omits an embedding area for GRUB in the automatic layout.

# Swap choice: DevOS uses zram by default, so disk swap is optional
userSwapChoices:
    - none
    - small
    - suspend
initialSwapChoice: none

# Windows Setup–like default: wipe the selected disk and install DevOS.
# "Erase disk" removes every partition on that one SSD/HDD (Windows, Linux,
# recovery, etc.), then creates EFI + root. Other physical disks stay untouched
# unless the user picks them. Manual partitioning remains available for dual-boot.
allowManualPartitioning: true
initialPartitioningChoice: erase
alwaysShowPartitionLabels: true

# Show nested layouts so an old Windows or Linux disk is readable before erase
drawNestedPartitions: true

# What "Erase disk" creates after the EFI partition. Without this list
# Ubuntu's Calamares 3.3.5 made only the EFI partition, left the rest as free
# space, and kept Next disabled.
# "unknown" uses the filesystem picked in the btrfs/ext4 box.
partitionLayout:
    - name: "DevOS"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
