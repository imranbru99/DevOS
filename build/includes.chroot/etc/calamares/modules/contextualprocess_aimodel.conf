# Generated by tools/gen-installer-data.py from components/ai-core/model_catalog.py.
# Writes the model picked on the "Choose your DevOS AI" page into the new
# system; devos-ai-models.service downloads it once the PC is online.
# Calamares names the global-storage key packagechooser_<id>; older builds
# use the bare id, so both are listed.
# Soft-fail: a missing AI helper must never abort a finished OS install.
---
dontChroot: false
timeout: 120
packagechooser_aimodel:
    "tiny": "/bin/bash -c '/usr/local/bin/devos-ai-models choose --value tiny --no-download || true'"
    "tiny+vision": "/bin/bash -c '/usr/local/bin/devos-ai-models choose --value tiny+vision --no-download || true'"
    "tiny+coder": "/bin/bash -c '/usr/local/bin/devos-ai-models choose --value tiny+coder --no-download || true'"
    "tiny+vision+coder": "/bin/bash -c '/usr/local/bin/devos-ai-models choose --value tiny+vision+coder --no-download || true'"
