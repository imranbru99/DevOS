# "Choose your apps" page. The page itself is branding/devos/featuresq.qml;
# it stores the ticked feature ids ("onlyoffice,chrome,…") under
# global-storage key packagechooser_features.
---
method: legacy
id: features
qmlSearch: both
qmlFilename: /etc/calamares/branding/devos/featuresq.qml
labels:
    step: "Apps"
