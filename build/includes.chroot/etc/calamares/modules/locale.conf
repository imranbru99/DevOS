---
# Language for menus/messages. Region still sets timezone (e.g. Asia/Dhaka).
# Leaving formats tied to BD made the Plasma clock show Bangla day-periods
# (বিকাল/সকাল) even when the UI language was English.
#
# Formats are reasserted to en_US immediately after localecfg by
# shellprocess@english-ui (devos-force-english-ui). Bangla stays typing-only.
localeGenPath: /etc/locale.gen
geoip:
    style: none
