# Soft stand-in for preservefiles@features-preserve.
# Stock preservefiles can hard-fail the install after GRUB is already written.
# Features plan is rebuilt by shellprocess@features-shell either way.
---
dontChroot: false
timeout: 60
script:
    - "/bin/bash -c 'mkdir -p /var/lib/DevOS; touch /var/lib/DevOS/install-choices.json; chmod 400 /var/lib/DevOS/install-choices.json 2>/dev/null || true; exit 0'"
