# Turn the copied live system into a disk installation.
# Must stay fast: users saw ~64% "Running shell processes…" frozen 10+ minutes
# when branding/swap ran here. Heavy polish is deferred to first boot.
# Wrapper always exits 0 so soft warnings cannot abort the OS setup.
---
dontChroot: false
timeout: 120
script:
    - "/bin/bash -c 'set +e; /bin/bash /usr/local/sbin/devos-install-finalize; exit 0'"
