# DevOS GRUB defaults on the installed disk
---
overwrite: true
defaults:
    GRUB_DEFAULT: "0"
    # Start DevOS straight away. Hold Shift or Esc during start-up for the menu.
    # Ubuntu's os-prober script still shows the menu when Windows is found.
    GRUB_TIMEOUT: 0
    GRUB_TIMEOUT_STYLE: hidden
    # btrfs /boot cannot store grubenv, so every boot looked like a failed one
    # and GRUB waited 30 s on the "DevOS GNU/Linux" menu.
    GRUB_RECORDFAIL_TIMEOUT: 0
    GRUB_DISTRIBUTOR: "DevOS"
    GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash plymouth.theme=devos"
    GRUB_CMDLINE_LINUX: ""
    GRUB_DISABLE_RECOVERY: false
    GRUB_DISABLE_OS_PROBER: false
