# "How will you use this PC?" page, shown just before Choose your apps.
# The choice is a short id (normal, developer, gamer, islamic) under
# global-storage key packagechooser_usertype. The apps page reads it and
# ticks that set. The installed system only keeps the app list.
---
method: legacy
id: usertype
qmlSearch: both
qmlFilename: /etc/calamares/branding/devos/usertypeq.qml
labels:
    step: "You"
