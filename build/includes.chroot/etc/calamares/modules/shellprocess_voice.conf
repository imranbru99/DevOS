# Apply installer Voice & Mira choices into the new system.
# Must run AFTER preservefiles@features-preserve and BEFORE
# shellprocess@features-shell (which deletes install-choices.json).
# Soft-fail wrapper: voice prefs must never abort a bootable install.
---
dontChroot: false
timeout: 120
script:
    - |
      /bin/bash -c 'set +e
      mkdir -p /var/lib/DevOS /etc/skel/.config/devos
      /usr/bin/python3 - <<'"'"'PY'"'"'
      import json, os, sys
      sys.path.insert(0, "/usr/local/share/devos/components/assistant")
      try:
          import voice_prefs
      except Exception as exc:
          print("voice_prefs missing:", exc)
          raise SystemExit(0)
      raw = ""
      stamp = "/var/lib/DevOS/voice-choice.txt"
      for path in (
          stamp,
          "/tmp/calamares-voice-choice",
          "/var/lib/DevOS/install-choices.json",
      ):
          if not os.path.isfile(path):
              continue
          try:
              if path.endswith(".json"):
                  data = json.load(open(path, encoding="utf-8"))
                  if isinstance(data, dict):
                      raw = str(data.get("packagechooser_voice") or data.get("voice") or "")
              else:
                  raw = open(path, encoding="utf-8").read().strip()
          except Exception:
              continue
          if raw and ("mira=" in raw or "gender=" in raw or "wake=" in raw):
              break
          raw = ""
      if not raw:
          raw = "mira=1;gender=female;lang=auto;wake=Mira"
      try:
          with open(stamp, "w", encoding="utf-8") as fh:
              fh.write(raw.strip() + "\n")
      except OSError:
          pass
      try:
          prefs = voice_prefs.apply_installer_choice(raw)
          print("Applied voice prefs:", prefs)
      except Exception as exc:
          print("voice apply skipped:", exc)
      PY
      exit 0'
