# DevOS Calamares Settings Configuration
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/share/calamares/modules ]

# A module@id entry in the sequence must be declared here, or Calamares
# refuses to start ("Calamares Initialization Failed").
instances:
  - id: firmware
    module: shellprocess
    config: shellprocess_firmware.conf
  - id: efifallback
    module: shellprocess
    config: shellprocess_efifallback.conf
  - id: finalize
    module: shellprocess
    config: shellprocess.conf
  - id: install-done
    module: shellprocess
    config: shellprocess_install_done.conf
  - id: storage
    module: packagechooserq
    config: packagechooserq_storage.conf
  - id: aimodel
    module: packagechooserq
    config: packagechooserq_aimodel.conf
  - id: aimodel-apply
    module: contextualprocess
    config: contextualprocess_aimodel.conf
  - id: usertype
    module: packagechooserq
    config: packagechooserq_usertype.conf
  - id: features
    module: packagechooserq
    config: packagechooserq_features.conf
  - id: features-preserve
    module: preservefiles
    config: preservefiles_features.conf
  - id: features-shell
    module: shellprocess
    config: shellprocess_features.conf
  - id: voice
    module: packagechooserq
    config: packagechooserq_voice.conf
  - id: voice-apply
    module: shellprocess
    config: shellprocess_voice.conf
  - id: install-ping
    module: shellprocess
    config: shellprocess_install_ping.conf
  - id: summaryreview
    module: packagechooserq
    config: packagechooserq_summary.conf

sequence:
  - show:
      - welcomeq
      - locale
      - keyboard
      - partition
      - usersq
      - packagechooserq@storage
      - packagechooserq@aimodel
      - packagechooserq@voice
      - packagechooserq@usertype
      - packagechooserq@features
      - packagechooserq@summaryreview
  - exec:
      # Free the erase target (unmount / wipefs / sgdisk) so sfdisk can create GPT.
      # Without this, a second install after Windows Fast Startup often fails on nvme.
      - devosprepare
      # Core install — get a bootable disk as early as possible.
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - usersq
      - displaymanager
      - luksbootkeyfile
      - shellprocess@finalize
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess@efifallback
      - shellprocess@firmware
      # Optional extras (after GRUB). Jobs themselves must tolerate failure;
      # this Calamares build does not treat a leading "-" as "skip on error".
      - devosstorage
      - contextualprocess@aimodel-apply
      - preservefiles@features-preserve
      - shellprocess@voice-apply
      - shellprocess@features-shell
      - shellprocess@install-ping
      - shellprocess@install-done
      # Stock umount can fail the whole install when a process still holds
      # /tmp/calamares-root-* (false failure after GRUB is already written).
      - devosumount
  - show:
      - finished

branding: devos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
