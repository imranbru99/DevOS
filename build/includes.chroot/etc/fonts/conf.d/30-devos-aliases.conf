<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- DevOS Premium Typography: Open-Source Font Aliasing -->
  <match target="pattern">
    <test name="family" qual="any"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Caladea</string></edit>
  </match>

  <!-- Default Monospace for Developers -->
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Fira Code</string></edit>
  </match>
</fontconfig>
