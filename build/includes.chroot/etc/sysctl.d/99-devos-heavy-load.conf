# DevOS high-performance desktop defaults.
# Bound deferred disk writes on large-memory PCs as well as small machines.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500
# Prefer fast compressed zram before the lower-priority disk swap.
vm.swappiness = 80
vm.page-cluster = 0
# Keep file cache longer so apps reopen instantly.
vm.vfs_cache_pressure = 50
# Reclaim a bit earlier under pressure so the UI does not hang first.
vm.watermark_scale_factor = 40
# Support modern games, IDEs, and multi-day AI coding agents watching large trees.
vm.max_map_count = 2097152
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 2048
fs.file-max = 2097152
kernel.sched_autogroup_enabled = 1
# Enable full Magic SysRq for emergency recovery (e.g. keyboard reset, clean reboot).
kernel.sysrq = 1
# Keep diagnostic/emergency recovery available; do not reboot after OOM.
vm.panic_on_oom = 0
kernel.panic = 0
# Long compiles / agent tool loops should not trip hung-task spam.
kernel.hung_task_timeout_secs = 300
# Faster multi-tab / media networking (BBR + larger buffers).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.netdev_max_backlog = 5000
net.core.somaxconn = 1024
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
