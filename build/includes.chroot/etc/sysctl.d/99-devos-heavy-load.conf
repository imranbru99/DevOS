# DevOS High-Performance & Bulletproof Resilience Kernel Tuning
# Engineered to prevent UI freezes, memory thrashing, lockups, and sudden failures under heavy AI & compiler workloads.

# 1. High-Performance Virtual Memory & VMA Scaling
# Massive virtual memory area limit: prevents Chrome, Node, Electron, PyTorch & large LLMs from crashing with OOM
vm.max_map_count = 2147483642
# 128 MB reserved unfragmented memory for kernel interrupts, networking, and Wayland compositor allocation
vm.min_free_kbytes = 131072
# Fast in-RAM zram compression priority over premature page cache dropping
vm.swappiness = 150
# Balanced filesystem metadata caching to keep directory trees and Git repositories instant in RAM
vm.vfs_cache_pressure = 50
# Trigger background memory reclaim earlier to eliminate abrupt stutter pauses
vm.watermark_scale_factor = 200

# 2. I/O Stalling & Desktop Freeze Prevention
# Flush dirty memory pages to disk smoothly in small, frequent background bursts
# Prevents large file downloads, ISO builds, or Docker operations from flooding disk queues and freezing the desktop
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500
# Disable swap readahead on zram devices to save CPU cycles and RAM latency
vm.page-cluster = 0

# 3. Crash, Panic, & Hang Elimination
# Never panic on Out-Of-Memory; let intelligent user-space OOM killer intervene
vm.panic_on_oom = 0
# Never reboot on kernel oops or warnings; keep desktop running
kernel.panic = 0
kernel.panic_on_oops = 0
kernel.panic_on_warn = 0
# Detect hung background tasks after 120s without hard system panic
kernel.hung_task_timeout_secs = 120
kernel.hung_task_panic = 0
kernel.softlockup_panic = 0
# Enable SysRq emergency keystroke safety valve
kernel.sysrq = 1

# 4. CPU & Task Scheduling Responsiveness
# Autogrouping isolates background compilation/agent jobs from interactive desktop sessions
kernel.sched_autogroup_enabled = 1

# 5. File System & Inotify Watcher Expansion
# Extreme capacity for multiple concurrent AI agents, IDEs, and build watchers
fs.file-max = 4194304
fs.inotify.max_user_watches = 2097152
fs.inotify.max_user_instances = 8192

# 6. Ultra-Fast High-Throughput Networking
# High socket backlog and instant TCP connection re-use for local and remote AI APIs
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.netdev_max_backlog = 10000
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
