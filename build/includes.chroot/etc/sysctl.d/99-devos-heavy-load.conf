# DevOS responsiveness defaults. These reduce contention, not hardware limits.
# Bound deferred disk writes on large-memory PCs as well as small machines.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500
# Prefer compressed zram before disk swap; keep the kernel's adaptive free reserve.
vm.swappiness = 150
vm.page-cluster = 0
vm.vfs_cache_pressure = 100
vm.watermark_scale_factor = 100
# Support modern games, IDEs and file watchers without extreme per-user limits.
vm.max_map_count = 1048576
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
kernel.sched_autogroup_enabled = 1
# Keep diagnostic/emergency recovery available; do not reboot after OOM.
vm.panic_on_oom = 0
kernel.panic = 0
kernel.hung_task_timeout_secs = 120
