# DevOS Heavy Load & Anti-Hang Kernel Tuning
# Prevents UI freezes, thrashing, and lockups under extreme RAM & I/O load

# 1. Memory & Swap Thrashing Prevention
# vm.swappiness = 150: Prioritizes fast in-RAM zram compression over dropping active file cache
vm.swappiness = 150
# Lower cache pressure keeps filesystem metadata and directory trees hot in RAM
vm.vfs_cache_pressure = 50
# Watermark scale factor triggers background memory reclaim earlier to avoid abrupt pauses
vm.watermark_scale_factor = 200

# 2. I/O Stalling Prevention
# Lower dirty ratios prevent heavy disk writes (e.g., big downloads, compiler jobs)
# from flooding disk queues and stalling interactive desktop applications
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
# Expire dirty memory pages more frequently
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500

# 3. Memory Overcommit & Panic Safety
# Keep minimum free memory reserved for kernel and compositor safety
vm.min_free_kbytes = 65536
# Avoid panic on OOM; prioritize OOM killer intervention
vm.panic_on_oom = 0
# A crash stays on screen until a person restarts.
kernel.panic = 0
kernel.panic_on_oops = 0
# zram does not benefit from swap readahead
vm.page-cluster = 0

# 4. IPC and Process Scheduling Responsiveness
kernel.sched_autogroup_enabled = 1

# 5. Many agent browsers at once
# Each browser watches its own profile. The defaults run out of watches and
# file handles long before RAM does, and then new windows fail to load.
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 2048
fs.file-max = 2097152
