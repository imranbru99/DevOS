# DevOS live-boot initramfs configuration
# MODULES=most pulls in a broad driver set so the live USB works on any real PC.
MODULES=most
BUSYBOX=auto
KEYMAP=n
COMPRESS=zstd
COMPRESSLEVEL=3
DEVICE=
NFS=
RUNSIZE=10%

# Optional firmware to include in the live initrd. Most firmware stays in
# /lib/firmware on the rootfs; this only helps very early devices.
FIRMWARE=yes
