# DevOS: Prevent applications from overriding master sink volume
pulse.rules = [
    {
        matches = [
            {
                # Target media apps and web browsers known to force sink volume
                application.process.binary = "~(chrome|google-chrome|chromium|falkon|firefox|vlc|mpv|spotify|discord|electron).*"
            }
        ]
        actions = {
            quirks = [ block-sink-volume ]
        }
    }
]
