# DevOS AI Core — memory sleep policy (robust default for every PC).
#
# The HTTP service may stay running, but the large local model must NOT sit in
# RAM when nobody is chatting. That was the "Server.py = 5 GB" Task Manager bug.
#
# idle_timeout = seconds after the last DevOS AI message before the model is
#               unloaded (minimum 60). Next message loads it again.
# warmup       = 0/false: do not preload at boot (recommended).
#              = 1/true: preload at login (fast first reply, high idle RAM).

idle_timeout=600
warmup=0
