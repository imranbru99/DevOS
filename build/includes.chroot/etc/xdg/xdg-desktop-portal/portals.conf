[preferred]
default=kde
org.freedesktop.impl.portal.FileChooser=devos;kde;
org.freedesktop.impl.portal.Settings=kde;gtk;
# Do NOT force Secret=kwallet. DevOS disables KWallet (kwalletrc Enabled=false);
# starting org.freedesktop.impl.portal.desktop.kwallet exits 255 and breaks
# xdg-desktop-portal, so Upload/Download/Open file pickers never appear.
