[preferred]
default=kde
org.freedesktop.impl.portal.FileChooser=devos;kde;
org.freedesktop.impl.portal.Settings=kde;gtk;
# Do not force the KWallet Secret backend. DevOS disables KWallet
# (kwalletrc Enabled=false); that backend exits 255 and breaks
# xdg-desktop-portal, so Upload/Download/Open file pickers never appear.
