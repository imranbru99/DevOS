<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Modesty filter</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Modesty filter</h1>
  <p id="lock" class="lock" hidden>Locked by DevOS. It stays on; you can only make it stricter.</p>
  <div class="row" id="enabledRow">
    <label for="enabled">Filter on</label>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>
  <div class="row">
    <label for="mode">Blur</label>
    <select id="mode">
      <option value="women">Adult women</option>
      <option value="people">All people</option>
    </select>
  </div>
  <div class="counts">
    <div><strong id="tabCount">0</strong><span>blurred on this page</span></div>
    <div><strong id="total">0</strong><span>blurred in total</span></div>
  </div>
  <p class="note">Checked on this PC only. No picture leaves your computer.
     Only detected body regions are blurred. Text stays readable. Age, gender and body estimates can be wrong or missed.</p>
  <script src="rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
